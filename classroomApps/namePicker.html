<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Random Name Picker</title>

<style>
  /* ---------- Basic reset & theme colors ---------- */
  :root {
    --blue: #0046AD;
    --green: #58A618;
    --orange: #f45922;
    --bg: #f7f8fa;
    --card-bg: #ffffff;
    --text: #1a1a1a;
    --muted: #5a5f66;
    --border: #d8dce1;
    --focus-ring: #0046AD;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    font-family: "Atkinson Hyperlegible", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    justify-content: center;
    padding: 1.5rem;
    min-height: 100vh;
  }

  main {
    width: 100%;
    max-width: 640px;
  }

  h1 {
    font-family: "Nunito", "Comfortaa", sans-serif;
    font-size: clamp(1.5rem, 5vw, 2.2rem);
    color: var(--blue);
    text-align: center;
    margin-bottom: 0.25rem;
  }

  p.subtitle {
    text-align: center;
    color: var(--muted);
    margin-top: 0;
    margin-bottom: 2rem;
  }

  /* ---------- The card that displays the chosen name ---------- */
  #nameCard {
    background: var(--card-bg);
    border: 2px solid var(--border);
    border-radius: 16px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    min-height: 120px;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 1.5rem;
    box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
  }

  #nameDisplay {
    font-family: "Nunito", "Comfortaa", sans-serif;
    font-size: clamp(1.6rem, 6vw, 2.6rem);
    font-weight: 700;
    color: var(--text);
    word-break: break-word;
  }

  #nameDisplay.empty {
    font-size: 1.1rem;
    color: var(--muted);
    font-weight: 400;
  }

  /* ---------- Buttons ---------- */
  .button-row {
    display: flex;
    flex-wrap: wrap;
    gap: 0.75rem;
    justify-content: center;
    margin-bottom: 2rem;
  }

  button {
    font-family: inherit;
    font-size: 1rem;
    font-weight: 600;
    padding: 0.75rem 1.5rem;
    border-radius: 10px;
    border: 2px solid transparent;
    cursor: pointer;
    transition: transform 0.08s ease, box-shadow 0.15s ease;
  }

  button:active {
    transform: scale(0.97);
  }

  button:focus-visible {
    outline: 3px solid var(--focus-ring);
    outline-offset: 2px;
  }

  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
  }

  #pickBtn {
    background: var(--orange);
    color: white;
  }
  #pickBtn:hover:not(:disabled) {
    box-shadow: 0 4px 10px rgba(244, 89, 34, 0.35);
  }

  #resetBtn {
    background: white;
    color: var(--blue);
    border-color: var(--blue);
  }
  #resetBtn:hover:not(:disabled) {
    box-shadow: 0 4px 10px rgba(0, 70, 173, 0.2);
  }

  /* ---------- Remaining / chosen lists ---------- */
  .lists-wrap {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }

  @media (max-width: 480px) {
    .lists-wrap {
      grid-template-columns: 1fr;
    }
  }

  .list-box {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
  }

  .list-box h2 {
    font-family: "Nunito", "Comfortaa", sans-serif;
    font-size: 1rem;
    margin: 0 0 0.5rem 0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.03em;
  }

  .list-box ul {
    list-style: none;
    margin: 0;
    padding: 0;
    max-height: 220px;
    overflow-y: auto;
  }

  .list-box li {
    padding: 0.35rem 0.25rem;
    border-bottom: 1px solid #eef0f2;
    font-size: 0.95rem;
  }

  .list-box li:last-child {
    border-bottom: none;
  }

  #chosenList li {
    color: var(--muted);
    text-decoration: line-through;
  }

  .count-badge {
    display: inline-block;
    background: var(--green);
    color: white;
    font-size: 0.75rem;
    font-weight: 700;
    border-radius: 999px;
    padding: 0.1rem 0.5rem;
    margin-left: 0.4rem;
  }

  /* ---------- Screen-reader only text ---------- */
  .sr-only {
    position: absolute;
    width: 1px;
    height: 1px;
    padding: 0;
    margin: -1px;
    overflow: hidden;
    clip: rect(0, 0, 0, 0);
    white-space: nowrap;
    border: 0;
  }
</style>
</head>
<body>

<main>
  <h1>Random Name Picker</h1>
  <p class="subtitle">Click the button to pick a random name. Each name is only picked once.</p>

  <!-- The result card. aria-live="polite" means screen readers will announce
       the new name automatically whenever it changes, without extra code. -->
  <section id="nameCard" aria-live="polite">
    <span id="nameDisplay" class="empty">No name picked yet</span>
  </section>

  <div class="button-row">
    <button id="pickBtn" type="button">Pick a Random Name</button>
    <button id="resetBtn" type="button">Reset List</button>
  </div>

  <div class="lists-wrap">
    <div class="list-box">
      <h2>Remaining <span id="remainingCount" class="count-badge">0</span></h2>
      <ul id="remainingList" aria-label="Names remaining to be picked"></ul>
    </div>
    <div class="list-box">
      <h2>Already Picked <span id="chosenCount" class="count-badge">0</span></h2>
      <ul id="chosenList" aria-label="Names already picked"></ul>
    </div>
  </div>

  <!-- Hidden live region used only to announce status messages (e.g. "all names picked")
       separately from the name card itself. -->
  <div id="statusMessage" class="sr-only" role="status" aria-live="polite"></div>
</main>

<script>
  /* =====================================================================
     EDITABLE DATA
     -----------------------------------------------------------------
     This is the list of names the app picks from. To change the names,
     just edit this array - nothing else in the code needs to change.
     ===================================================================== */
  const NAME_LIST = [
    "Elias Vance",
    "Maya Lin",
    "Jackson Reed",
    "Sophia Patel",
    "Lucas Hayes",
    "Chloe Bennett",
    "Julian Rossi",
    "Zara Brooks",
    "Leo Carter",
    "Nora Gallagher",
    "Ryan Foster",
    "Ava Mitchell",
    "Caleb Hughes",
    "Hannah Kim",
    "Ethan Mercer",
    "Penelope Cruz",
    "Gabriel Ward",
    "Stella Torres",
    "Marcus Jenkins"
  ];

  /* =====================================================================
     APP STATE
     -----------------------------------------------------------------
     remainingNames: names that have NOT been picked yet.
     chosenNames: names that HAVE been picked, in the order they were chosen.
     We copy NAME_LIST into remainingNames (instead of using it directly)
     so that resetting the app is as simple as copying the array again -
     the original NAME_LIST is never modified.
     ===================================================================== */
  let remainingNames = [...NAME_LIST];
  let chosenNames = [];

  /* ---------- Grab references to the elements we'll update ---------- */
  const nameDisplay = document.getElementById("nameDisplay");
  const pickBtn = document.getElementById("pickBtn");
  const resetBtn = document.getElementById("resetBtn");
  const remainingList = document.getElementById("remainingList");
  const chosenList = document.getElementById("chosenList");
  const remainingCount = document.getElementById("remainingCount");
  const chosenCount = document.getElementById("chosenCount");
  const statusMessage = document.getElementById("statusMessage");

  /* =====================================================================
     renderLists()
     -----------------------------------------------------------------
     Redraws the "Remaining" and "Already Picked" columns, and updates
     their count badges, based on the current state. Called after every
     pick or reset so the screen always matches the data.
     ===================================================================== */
  function renderLists() {
    // Clear out old list items first.
    remainingList.innerHTML = "";
    chosenList.innerHTML = "";

    // Rebuild the "remaining" list.
    remainingNames.forEach((name) => {
      const li = document.createElement("li");
      li.textContent = name;
      remainingList.appendChild(li);
    });

    // Rebuild the "already picked" list.
    chosenNames.forEach((name) => {
      const li = document.createElement("li");
      li.textContent = name;
      chosenList.appendChild(li);
    });

    // Update the little number badges.
    remainingCount.textContent = remainingNames.length;
    chosenCount.textContent = chosenNames.length;

    // Disable the pick button once every name has been used.
    pickBtn.disabled = remainingNames.length === 0;
  }

  /* =====================================================================
     pickRandomName()
     -----------------------------------------------------------------
     Picks a random name out of remainingNames, moves it into
     chosenNames, and updates the display.
     ===================================================================== */
  function pickRandomName() {
    if (remainingNames.length === 0) {
      statusMessage.textContent = "All names have been picked. Reset the list to start over.";
      return;
    }

    // Pick a random index within the remaining names.
    const randomIndex = Math.floor(Math.random() * remainingNames.length);
    const pickedName = remainingNames[randomIndex];

    // Remove the picked name from "remaining" and add it to "chosen".
    remainingNames.splice(randomIndex, 1);
    chosenNames.push(pickedName);

    // Update the big display card.
    nameDisplay.textContent = pickedName;
    nameDisplay.classList.remove("empty");

    // Let screen reader users know what happened, beyond just the name itself.
    if (remainingNames.length === 0) {
      statusMessage.textContent = pickedName + " was picked. That was the last name in the list.";
    } else {
      statusMessage.textContent = pickedName + " was picked.";
    }

    renderLists();
  }

  /* =====================================================================
     resetApp()
     -----------------------------------------------------------------
     Restores the app to its starting state: every name back in
     "remaining", nothing in "chosen", and the display cleared.
     ===================================================================== */
  function resetApp() {
    remainingNames = [...NAME_LIST];
    chosenNames = [];

    nameDisplay.textContent = "No name picked yet";
    nameDisplay.classList.add("empty");
    statusMessage.textContent = "The list has been reset. All names are available again.";

    renderLists();
  }

  /* ---------- Wire up the buttons ---------- */
  pickBtn.addEventListener("click", pickRandomName);
  resetBtn.addEventListener("click", resetApp);

  /* ---------- Draw the initial lists when the page first loads ---------- */
  renderLists();
</script>

</body>
</html>
